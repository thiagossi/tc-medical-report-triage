[project]
name = "tc-medical-report-triage"
version = "0.1.0"
description = "Automatic triage of medical reports by urgency (normal / attention / urgent)"
authors = [
    {name = "thiagossi",email = "thiagossi@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["pandas (>=3.0.6,<4.0.0)", "scikit-learn (>=1.9.1,<2.0.0)", "joblib (>=1.6.0,<2.0.0)", "fastapi (>=0.143.0,<0.144.0)", "uvicorn[standard] (>=0.54.0,<0.55.0)", "prometheus-client (>=0.26.0,<0.27.0)", "onnxruntime (>=1.31.0,<2.0.0)"]

[tool.poetry]
packages = [{ include = "triage", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.17.0,<0.18.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "skl2onnx (>=1.20.0,<2.0.0)"
]
